<!doctype html>
<html lang="en">

<head>
  <style>
    html:not(.auth-ready) body {
      visibility: hidden
    }
  </style>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create Roster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=aboutpageupdate1">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#047857">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SAIMS Roster">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js?v=20260710-1"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.update())));
    }
  </script>
  <link rel="icon" type="image/png" href="./icon-192.png?v=2">
  <link rel="apple-touch-icon" href="./icon-192.png?v=2">
</head>

<body data-page="roster">
  <header class="topbar multi-topbar"><a class="brand-link" href="index.html"><span class="app-brand"><img src="app-logo.svg?v=20260710-1" alt=""><span>Hospital Roster Builder</span></span></a><nav class="main-nav"><a href="index.html">Dashboard</a><a href="staff.html">Staff</a><a href="roster.html" class="active">Create Roster</a><a href="history.html">Previous Rosters</a><a href="about.html">About</a><button type="button" class="nav-logout" onclick="logoutRosterUser()">Logout</button></nav></header>
  <main class="container multi-page-container">
    <section class="card controls">
      <div class="row">
        <label>Roster Title
          <input id="rosterTitle" value="NURSING DUTY ROSTER">
        </label>
        <label>Month
          <select id="month"></select>
        </label>
        <label>Year
          <input id="year" type="number" min="2020" max="2100">
        </label>
        <button onclick="buildRoster()">Create / Refresh Roster</button>
      </div>
    </section>
    <section class="card duty-code-card">
      <div class="section-head duty-code-head">
        <h2>Duty Codes</h2>
        <button class="secondary compact-btn" onclick="addDutyCode()">+ Add Code</button>
      </div>
      <div id="dutyLegend" class="legend compact-legend"></div>
    </section>
    <section class="card roster-card">
      <div class="toolbar no-print">
        <button onclick="saveRoster()">Save Roster</button>
        <button class="secondary" onclick="printAdaptiveRoster()">Print Roster</button>
        <button class="secondary" onclick="downloadPDF()">Download PDF</button>
        <button class="secondary" onclick="sharePDF()">Share PDF</button>
        <button class="secondary" onclick="downloadExcel()">Download Excel</button>

        <!-- Roster Grid Zoom Controls -->
        <div class="zoom-controls">
          <button class="secondary btn-icon" onclick="adjustRosterZoom(-0.1)" title="Zoom Out"
            type="button">🔍−</button>
          <span id="zoomLevel">100%</span>
          <button class="secondary btn-icon" onclick="adjustRosterZoom(0.1)" title="Zoom In" type="button">🔍+</button>
          <button class="secondary btn-icon" onclick="resetRosterZoom()" title="Reset Zoom" type="button">🔄</button>
        </div>
      </div>

      <div id="printArea">
        <div class="hospital-header">
          <img src="hospital-logo.jpg" alt="Hospital logo">
          <div>
            <h2>Jain Diwakar Sri Aurobindo Hospital, Ratlam</h2>
            <h3 id="printTitle">NURSING DUTY ROSTER</h3>
            <p id="printMonth"></p>
          </div>
        </div>
        <div class="table-scroll roster-scroll">
          <table id="rosterTable" class="roster"></table>
        </div>
        <div id="printLegend" class="print-legend"></div>
        <div class="signature-row">
          <div class="signature-box">
            <div class="signature-line"></div>
            <strong>Signature of Nursing Supt.</strong>
          </div>
          <div class="signature-box">
            <div class="signature-line"></div>
            <strong>Signature of Medical Supt.</strong>
          </div>
        </div>
      </div>
    </section>
    <footer>© 2026 • Developed and Designed By <strong>Lakshya Purohit</strong></footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="script.js?v=passkey2"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(console.error);
      });
    }
  </script>

  <script src="./pwa-install.js"></script>
</body>

</html>

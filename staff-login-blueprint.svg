<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Hospital Roster Builder — Staff Login Blueprint</title>
  <desc id="desc">Architecture and user flow for a future staff-only duty viewer, separate from the administrator workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8f5"/><stop offset="1" stop-color="#e9f1ec"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16483d"/><stop offset="1" stop-color="#08785e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173e35" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#16846a"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#173c34}.title{font-size:38px;font-weight:800;letter-spacing:-.5px}.subtitle{font-size:17px;fill:#617773}.section{font-size:15px;font-weight:800;letter-spacing:1.5px;fill:#08785e}.cardTitle{font-size:20px;font-weight:750}.body{font-size:15px;fill:#4d6661}.small{font-size:13px;fill:#6d807c}.tiny{font-size:12px;fill:#6d807c}.pill{font-size:12px;font-weight:800;letter-spacing:.5px}.number{font-size:14px;font-weight:800;fill:#fff}.white{fill:#fff}.whiteMuted{fill:#d4e9e0}.mono{font-family:Consolas,monospace;font-size:14px;fill:#174a3d}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <circle cx="1460" cy="-30" r="250" fill="#d9ebe1" opacity=".55"/>
  <circle cx="-20" cy="1030" r="230" fill="#dcece3" opacity=".7"/>
  <g transform="translate(72 54)">
    <rect width="52" height="52" rx="16" fill="url(#green)"/>
    <path d="M26 9 40 14v11c0 10-6 16-14 20-8-4-14-10-14-20V14z" fill="none" stroke="#fff" stroke-width="2.4"/>
    <path d="M19 18h14v14H19zM22 22h2m5 0h2m-9 4h2m5 0h2m-9 4h2m5 0h2" fill="none" stroke="#fff" stroke-width="1.8"/>
    <text x="70" y="24" class="section">HOSPITAL ROSTER BUILDER</text>
    <text x="70" y="78" class="title">Staff Login — Blueprint</text>
    <text x="70" y="109" class="subtitle">Separate staff access, with each person limited to their own scheduled duties.</text>
  </g>

  <text x="74" y="222" class="section">HOW SIGN-IN AND DUTY VIEW WORK</text>
  <g filter="url(#shadow)">
    <rect x="70" y="248" width="330" height="218" rx="22" fill="#fff" stroke="#dce8e2"/>
    <rect x="430" y="248" width="330" height="218" rx="22" fill="#fff" stroke="#dce8e2"/>
    <rect x="790" y="248" width="330" height="218" rx="22" fill="#fff" stroke="#dce8e2"/>
    <rect x="1150" y="248" width="380" height="218" rx="22" fill="url(#green)"/>
  </g>
  <g>
    <circle cx="105" cy="287" r="19" fill="#08785e"/><text x="105" y="292" text-anchor="middle" class="number">1</text>
    <text x="137" y="294" class="cardTitle">Admin provisions account</text>
    <text x="98" y="335" class="body"><tspan x="98">Admin selects a staff member and</tspan><tspan x="98" dy="23">creates or invites their login.</tspan><tspan x="98" dy="35" class="small">Account can be disabled or reset</tspan><tspan x="98" dy="20" class="small">from staff management.</tspan></text>

    <circle cx="465" cy="287" r="19" fill="#08785e"/><text x="465" y="292" text-anchor="middle" class="number">2</text>
    <text x="497" y="294" class="cardTitle">Staff signs in</text>
    <text x="458" y="335" class="body"><tspan x="458">Dedicated Staff Login page</tspan><tspan x="458" dy="23">using their own email + password.</tspan><tspan x="458" dy="35" class="small">Successful sign-in provides a</tspan><tspan x="458" dy="20" class="small">verified Supabase user ID.</tspan></text>

    <circle cx="825" cy="287" r="19" fill="#08785e"/><text x="825" y="292" text-anchor="middle" class="number">3</text>
    <text x="857" y="294" class="cardTitle">Database checks identity</text>
    <text x="818" y="335" class="body"><tspan x="818">RLS maps the signed-in user to</tspan><tspan x="818" dy="23">one staff record and filters queries.</tspan><tspan x="818" dy="35" class="small">Access is enforced in Supabase,</tspan><tspan x="818" dy="20" class="small">not just hidden in the interface.</tspan></text>

    <text x="1183" y="294" class="cardTitle white">My Duty</text>
    <text x="1183" y="334" class="body whiteMuted"><tspan x="1183">Today · Upcoming · Month view</tspan><tspan x="1183" dy="25">Date, shift code and own subtitle</tspan><tspan x="1183" dy="25">No roster editing or staff directory</tspan></text>
    <rect x="1183" y="415" width="165" height="28" rx="14" fill="#bce79d"/><text x="1265" y="434" text-anchor="middle" class="pill" fill="#16483d">6-HOUR SESSION</text>
  </g>
  <path d="M405 357h18M765 357h18M1125 357h18" stroke="#16846a" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="74" y="534" class="section">DATABASE ACCESS BOUNDARY</text>
  <g filter="url(#shadow)">
    <rect x="70" y="560" width="670" height="260" rx="22" fill="#fff" stroke="#dce8e2"/>
    <rect x="770" y="560" width="760" height="260" rx="22" fill="#fff" stroke="#dce8e2"/>
  </g>
  <text x="100" y="602" class="cardTitle">Identity mapping table</text>
  <text x="100" y="638" class="mono">user_profiles</text>
  <g>
    <rect x="100" y="660" width="240" height="35" rx="8" fill="#edf5f1"/><text x="116" y="683" class="body">auth_user_id</text><text x="314" y="683" text-anchor="end" class="tiny">Supabase Auth</text>
    <rect x="100" y="704" width="240" height="35" rx="8" fill="#edf5f1"/><text x="116" y="727" class="body">role</text><text x="314" y="727" text-anchor="end" class="tiny">staff / admin</text>
    <rect x="100" y="748" width="240" height="35" rx="8" fill="#edf5f1"/><text x="116" y="771" class="body">staff_id · active</text><text x="314" y="771" text-anchor="end" class="tiny">linked person</text>
  </g>
  <path d="M357 721h70" stroke="#16846a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="447" y="654" width="258" height="120" rx="16" fill="#e9f5ee" stroke="#c6e2d4"/>
  <text x="576" y="690" text-anchor="middle" class="cardTitle">RLS policy</text>
  <text x="576" y="720" text-anchor="middle" class="body">auth.uid() → own staff_id</text>
  <text x="576" y="747" text-anchor="middle" class="small">Only matching duty rows pass</text>

  <text x="800" y="602" class="cardTitle">Data each role can access</text>
  <rect x="800" y="624" width="326" height="162" rx="16" fill="#edf6f1"/>
  <text x="824" y="660" class="section">STAFF</text>
  <text x="824" y="692" class="body"><tspan x="824">✓ Own current + saved assignments</tspan><tspan x="824" dy="27">✓ Own name and optional subtitle</tspan><tspan x="824" dy="27">× Other staff, admin pages, edits</tspan></text>
  <rect x="1146" y="624" width="350" height="162" rx="16" fill="#f4f6f5"/>
  <text x="1170" y="660" class="section">ADMIN</text>
  <text x="1170" y="692" class="body"><tspan x="1170">✓ Existing roster + staff controls</tspan><tspan x="1170" dy="27">✓ Create, disable, reset staff access</tspan><tspan x="1170" dy="27">✓ Full roster data remains admin-only</tspan></text>

  <rect x="70" y="858" width="1460" height="144" rx="22" fill="#173f35"/>
  <text x="102" y="901" class="section" fill="#bce79d">BUILD ORDER</text>
  <g class="body whiteMuted">
    <text x="102" y="941" class="body whiteMuted"><tspan font-weight="800" fill="#fff">01</tspan><tspan dx="12">Choose staff login identifier</tspan><tspan x="102" dy="24" class="small" fill="#d4e9e0">Recommended: email + password</tspan></text>
    <text x="470" y="941" class="body whiteMuted"><tspan font-weight="800" fill="#fff">02</tspan><tspan dx="12">Create profile mapping + secure account provisioning</tspan><tspan x="470" dy="24" class="small" fill="#d4e9e0">Server-side function; never expose service-role key</tspan></text>
    <text x="1045" y="941" class="body whiteMuted"><tspan font-weight="800" fill="#fff">03</tspan><tspan dx="12">Replace shared RLS with role-based rules</tspan><tspan x="1045" dy="24" class="small" fill="#d4e9e0">Test staff cannot read another person’s schedule</tspan></text>
  </g>
  <text x="800" y="1040" text-anchor="middle" class="tiny">Planning blueprint only · No staff-login implementation has been applied</text>
</svg>

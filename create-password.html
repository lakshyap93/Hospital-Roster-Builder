<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08785e">
  <title>Create password · Hospital Roster Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261002-5">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body class="hrb-login-page">
  <header class="login-topbar">
    <a class="brand-link" href="/">
      <img src="app-logo.svg" alt="">
      <span>Hospital Roster Builder</span>
    </a>
  </header>
  <main class="hrb-login-layout">
    <section class="hrb-login-brand" aria-labelledby="passwordBrandTitle">
      <div class="hrb-brand-content">
        <div class="hrb-brand-lockup"><img src="app-logo.svg" alt=""><div><strong>HOSPITAL</strong><span>ROSTER BUILDER</span></div></div>
        <p class="hrb-tag">ACCOUNT SETUP</p>
        <h1 id="passwordBrandTitle">One last step to get <em>started.</em></h1>
        <p class="hrb-copy">Choose a strong password for your roster workspace account.</p>
      </div>
    </section>
    <section class="hrb-login-form-side" aria-labelledby="passwordTitle">
      <div class="hrb-login-card">
        <p class="hrb-welcome">WELCOME</p>
        <h2 id="passwordTitle">Create your password</h2>
        <p class="hrb-sub">Use at least 8 characters.</p>
        <form id="createPasswordForm">
          <label for="newPassword">New password</label>
          <div class="hrb-field"><span aria-hidden="true">●</span><input id="newPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div>
          <label for="confirmPassword">Confirm password</label>
          <div class="hrb-field"><span aria-hidden="true">●</span><input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="Re-enter your password"></div>
          <button id="submitPasswordButton" class="hrb-submit" type="submit">Save password <span aria-hidden="true">→</span></button>
          <p id="passwordMessage" class="hrb-error" role="alert" aria-live="polite"></p>
        </form>
        <div class="hrb-secure"><span aria-hidden="true">●</span> Secure account setup</div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="env-router.js"></script>
  <script src="app-dialog.js?v=2"></script>
  <script src="create-password.js?v=20261002-4"></script>
  <script src="pwa-install.js?v=20261001-1"></script>
</body>
</html>
